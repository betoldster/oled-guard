# OLED Guard configuration — ~/.config/oled-guard/config.ini
# Created once by install.sh/update.sh; updates never overwrite it.
# Uncomment and change a line to override the default.
# Apply changes: systemctl --user restart oled-guard

[oled-guard]

# Idle time (seconds) before the screens go black.
#idle_threshold_seconds = 300

# How often idle time is checked (seconds).
#poll_interval_seconds = 15

# Stay on while an app blocks idle — video players and browsers do this only
# while a video plays. yes/no
#respect_idle_inhibitors = yes

# Comma-separated app ids to ignore (case-insensitive substring match), for
# apps that block idle permanently. See: watcher.py --check
#ignore_inhibitors = steam, discord

# Blank anyway after this much idle time, even while a video plays
# (seconds, 0 = never).
#max_inhibited_idle_seconds = 14400
